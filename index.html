<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Gráfico da função f(x) = x² - 4</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: auto;
      text-align: center;
    }
    canvas {
      border: 1px solid #333;
      margin-bottom: 20px;
    }
    .info {
      text-align: left;
    }
  </style>
</head>
<body>
  <h1>Gráfico da função f(x) = x² - 4</h1>
  <canvas id="grafico" width="500" height="300"></canvas>

  <div class="info">
    <h2>Contradomínio</h2>
    <p>Como f(x) = x² - 4, o valor mínimo é -4 (quando x = 0), então o contradomínio é <strong>f(x) ≥ -4</strong>.</p>

    <h2>Resolvendo as raízes (x1 e x2)</h2>
    <p>Queremos encontrar x tais que f(x) = 0:</p>
    <p>
      x² - 4 = 0<br/>
      x² = 4<br/>
      x = ±2
    </p>
    <p><strong>Raízes:</strong> x₁ = -2 e x₂ = 2</p>
  </div>

  <script>
    const canvas = document.getElementById('grafico');
    const ctx = canvas.getContext('2d');

    // Configurações
const width = canvas.width;
    const height = canvas.height;
    const originX = width / 2;
    const originY = height / 2 + 30;
    const scaleX = 20; // pixels por unidade em x
    const scaleY = 20; // pixels por unidade em y

    // Limpa canvas
    ctx.clearRect(0, 0, width, height);

    // Desenha eixos
    ctx.beginPath();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    // eixo X
    ctx.moveTo(0, originY);
    ctx.lineTo(width, originY);
    // eixo Y
    ctx.moveTo(originX, 0);
    ctx.lineTo(originX, height);
    ctx.stroke();

    // Marcações eixo X
    ctx.fillStyle = '#000';
    ctx.font = '12px Arial';
    for(let i = -10; i <= 10; i++){
      const x = originX + i * scaleX;
      ctx.fillRect(x, originY - 3, 1, 6);
      if(i !== 0) ctx.fillText(i, x - 5, originY + 15);
    }

    // Marcações eixo Y
    for(let i = -7; i <= 7; i++){
      const y = originY - i * scaleY;
      ctx.fillRect(originX - 3, y, 6, 1);
      if(i !== 0) ctx.fillText(i, originX + 10, y + 4);
    }

    // Desenha a função f(x) = x^2 - 4
    ctx.beginPath();
    ctx.strokeStyle = 'blue';
    ctx.lineWidth = 2;

    // Para x de -10 a 10 com passo 0.1
    for(let x = -10; x <= 10; x += 0.1){
      const y = x*x - 4;
      const px = originX + x * scaleX;
const py = originY - y * scaleY;

      if(x === -10) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Marca as raízes no gráfico
    function drawRoot(x) {
      const px = originX + x * scaleX;
      const py = originY;
      ctx.beginPath();
      ctx.fillStyle = 'red';
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'black';
      ctx.fillText(`x=${x}`, px - 10, py + 20);
    }

    drawRoot(-2);
    drawRoot(2);

    // Marca o ponto mínimo (0, -4)
    const minX = 0;
    const minY = -4;
    const minPx = originX + minX * scaleX;
    const minPy = originY - minY * scaleY;
    ctx.beginPath();
    ctx.fillStyle = 'green';
    ctx.arc(minPx, minPy, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'black';
    ctx.fillText('Mínimo (-4)', minPx - 25, minPy - 10);
  </script>
</body>
</html>
